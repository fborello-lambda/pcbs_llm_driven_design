<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24mm" height="40mm" viewBox="0 0 24 40">
  <title>Hornero building a mud nest</title>
  <desc>Adapted from Rufous hornero (Red ovenbird)(Furnarius rufus) and nest.JPG by Charles J. Sharp, CC BY-SA 4.0. Cropped and redrawn as monochrome PCB silkscreen. Photo: https://commons.wikimedia.org/wiki/File:Rufous_hornero_(Red_ovenbird)(Furnarius_rufus)_and_nest.JPG . License: https://creativecommons.org/licenses/by-sa/4.0/ . This derivative is CC BY-SA 4.0.</desc>
