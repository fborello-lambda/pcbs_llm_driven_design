  <polyline points="4.1,19.9 3.9,16.8 4.3,13.5 5.4,10.8 7.2,8.9 9.3,7.9 11.5,7.7 13.6,8.0 15.3,9.0 16.2,10.4" fill="none" stroke="#000" stroke-width="0.34" stroke-linecap="round" stroke-linejoin="round"/>
