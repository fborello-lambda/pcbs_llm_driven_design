  <polyline points="16.2,7.0 17.2,7.4 17.8,8.0" fill="none" stroke="#000" stroke-width="0.26" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="19.3,10.0 20.0,10.7 20.5,11.6" fill="none" stroke="#000" stroke-width="0.26" stroke-linecap="round" stroke-linejoin="round"/>
