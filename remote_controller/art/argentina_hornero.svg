  <polyline points="10.9,23.4 11.1,21.6 11.7,19.7 12.4,18.2 13.0,16.9 13.2,15.4 13.0,14.0 13.4,12.5 14.3,11.5 15.5,11.0 16.8,11.2 17.8,11.9 18.3,13.0 18.2,14.2 17.7,15.0 18.5,16.0 19.1,17.5 19.5,19.5 19.5,21.5 19.1,23.1" fill="none" stroke="#000" stroke-width="0.34" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="10.9,23.4 12.5,24.3 14.6,24.7 16.7,24.5 18.2,23.8 19.1,23.1" fill="none" stroke="#000" stroke-width="0.34" stroke-linecap="round" stroke-linejoin="round"/>

