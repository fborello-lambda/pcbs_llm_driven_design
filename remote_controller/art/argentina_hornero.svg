  <polyline points="11.4,22.3 10.2,23.6 11.7,23.2 13.0,22.7" fill="none" stroke="#000" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="11.3,22.8 9.7,24.1 11.6,23.7 12.8,23.2" fill="none" stroke="#000" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round"/>

