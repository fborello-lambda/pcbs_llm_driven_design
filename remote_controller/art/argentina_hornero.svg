  <polyline points="1.1,23.8 3.2,24.7 6.1,25.4 9.4,25.8 12.8,25.8 16.3,25.4 19.2,24.8 21.3,24.0" fill="none" stroke="#000" stroke-width="0.34" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="0.7,26.3 4.0,25.5 8.2,25.7 12.2,26.1 16.0,25.8 20.0,25.1 23.3,23.7" fill="none" stroke="#000" stroke-width="0.42" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="0.9,27.7 4.2,27.0 8.0,27.2 11.8,27.7 15.7,27.4 19.5,26.5 23.1,25.0" fill="none" stroke="#000" stroke-width="0.28" stroke-linecap="round" stroke-linejoin="round"/>

