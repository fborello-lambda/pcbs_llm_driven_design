  <polyline points="20.7,19.3 21.0,20.2 20.5,21.0" fill="none" stroke="#000" stroke-width="0.26" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="2.9,22.2 4.0,22.8 5.1,22.7" fill="none" stroke="#000" stroke-width="0.26" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="5.7,24.0 6.8,24.4 8.0,24.2" fill="none" stroke="#000" stroke-width="0.26" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="18.8,22.8 20.0,22.5 20.7,21.8" fill="none" stroke="#000" stroke-width="0.26" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="12" y="31.0" fill="#000" font-family="sans-serif" font-size="1.55" font-weight="700" text-anchor="middle">ARGENTINA</text>
  <text x="12" y="33.3" fill="#000" font-family="sans-serif" font-size="1.55" font-weight="700" text-anchor="middle">HORNERO</text>
  <text x="12" y="35.5" fill="#000" font-family="sans-serif" font-size="1.18" font-weight="700" text-anchor="middle">BUILDS WITH MUD</text>
</svg>
