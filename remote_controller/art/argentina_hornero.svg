  <polyline points="2.4,18.8 3.0,18.1 3.5,18.4" fill="none" stroke="#000" stroke-width="0.26" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="2.8,14.8 3.4,14.1 3.9,14.4" fill="none" stroke="#000" stroke-width="0.26" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="4.1,10.9 4.9,10.2 5.5,10.5" fill="none" stroke="#000" stroke-width="0.26" stroke-linecap="round" stroke-linejoin="round"/>
