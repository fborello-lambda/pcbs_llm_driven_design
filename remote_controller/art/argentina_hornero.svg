  <polyline points="17.7,13.1 19.2,12.6 21.1,12.7 19.3,13.4 17.8,13.6" fill="none" stroke="#000" stroke-width="0.28" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="21.1,12.7 21.7,12.4 22.3,12.7 22.6,13.2 22.1,13.6 21.4,13.4" fill="none" stroke="#000" stroke-width="0.28" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16.3" cy="12.5" r="0.34" fill="none" stroke="#000" stroke-width="0.26"/>

