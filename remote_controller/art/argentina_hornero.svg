  <polyline points="12.4,18.3 13.5,17.5 15.0,17.3 16.1,18.0 16.6,19.3 16.4,21.5 15.6,23.3" fill="none" stroke="#000" stroke-width="0.30" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="12.6,19.1 13.5,18.8 14.6,19.2 15.6,20.0" fill="none" stroke="#000" stroke-width="0.22" stroke-linecap="round" stroke-linejoin="round"/>
